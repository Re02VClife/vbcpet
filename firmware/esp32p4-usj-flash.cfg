# OpenOCD config: flash ESP32-P4C6-Core (final board) over its builtin USB-Serial/JTAG
# P4's USB-Serial/JTAG enumerates as VID_303A / PID_0012 (the bundled esp_usb_jtag.cfg only lists PID 0x1001 for S3/C3)
# Usage:  openocd -f board/esp32p4-builtin.cfg  (replace with this file)
adapter driver esp_usb_jtag
espusbjtag vid_pid 0x303a 0x0012
transport select jtag
source [find target/esp32p4.cfg]
