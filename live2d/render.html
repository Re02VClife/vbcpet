<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>vbcpet Live2D</title>
<style>body{margin:0;background:#111;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<script src="live2dcubismcore.min.js"></script>

<script type="importmap">
{"imports":{"pixi.js":"./node_modules/pixi.js/dist/pixi.mjs","@jannchie/pixi-live2d-display":"./node_modules/@jannchie/pixi-live2d-display/dist/cubism4.es.js"}}
</script>

<script>window.process={env:{}};</script>

<!-- 表情预设（用户在 tune_expressions.html 调好后替换此对象） -->
<script>
window._ready=false;window._model=null;window._motions=[];window._expressions=[];
window._emotions=['neutral','happy','sad','surprised','angry'];
window._mood=60;  /* 心情值 0-100, 基线 60 */
window._moodText=null;

/* 表情参数预设 — 由 tune_expressions.html 导出，用户可替换 */
const EMOTION_PRESETS = {
  neutral:   {
  "ParamEyeLOpen": 1,
  "ParamEyeROpen": 1,
  "ParamEyeLSmile": 0,
  "ParamEyeRSmile": 0,
  "ParamBrowLY": 0,
  "ParamBrowRY": 0,
  "ParamBrowLAngle": 0,
  "ParamBrowRAngle": 0,
  "ParamBrowLForm": 0,
  "ParamBrowRForm": 0,
  "ParamMouthOpenY": 0,
  "ParamMouthForm": 0,
  "ParamCheek": 0
},
  happy: {
  "ParamEyeLOpen": 0,
  "ParamEyeROpen": 0,
  "ParamEyeLSmile": 0.76,
  "ParamEyeRSmile": 0.76,
  "ParamBrowLY": -1,
  "ParamBrowRY": -1,
  "ParamBrowLAngle": 0.08,
  "ParamBrowRAngle": 0.09,
  "ParamBrowLForm": 0.64,
  "ParamBrowRForm": 0.63,
  "ParamMouthOpenY": 0.06,
  "ParamMouthForm": 0.25,
  "ParamCheek": 0.39
},
  sad:     {
  "ParamEyeLOpen": 0.41,
  "ParamEyeROpen": 0.41,
  "ParamEyeLSmile": -1,
  "ParamEyeRSmile": -1,
  "ParamBrowLY": -1,
  "ParamBrowRY": -1,
  "ParamBrowLAngle": -0.81,
  "ParamBrowRAngle": -0.81,
  "ParamBrowLForm": -1,
  "ParamBrowRForm": -1,
  "ParamMouthOpenY": 0.59,
  "ParamMouthForm": -0.36,
  "ParamCheek": 0
},
  surprised:{
  "ParamEyeLOpen": 1.2,
  "ParamEyeROpen": 1.2,
  "ParamEyeLSmile": 0.2,
  "ParamEyeRSmile": 0.19,
  "ParamBrowLY": 0.83,
  "ParamBrowRY": 0.83,
  "ParamBrowLAngle": 0.4,
  "ParamBrowRAngle": 0.4,
  "ParamBrowLForm": 0.79,
  "ParamBrowRForm": 0.79,
  "ParamMouthOpenY": 1.5,
  "ParamMouthForm": -0.31,
  "ParamCheek": 1
},
  angry:    {
  "ParamEyeLOpen": 0,
  "ParamEyeROpen": 0,
  "ParamEyeLSmile": -1,
  "ParamEyeRSmile": -1,
  "ParamBrowLY": -1,
  "ParamBrowRY": -1,
  "ParamBrowLAngle": -1,
  "ParamBrowRAngle": -1,
  "ParamBrowLForm": -1,
  "ParamBrowRForm": -1,
  "ParamMouthOpenY": 0.73,
  "ParamMouthForm": -0.35,
  "ParamCheek": 1
},
};
window._emotionPresets = EMOTION_PRESETS;

/* 通用播放动作 (PC bridge 调用) */
window.playMotion=function(n){
  if(window._model)try{window._model.motion(n);console.log('motion:',n);return true}catch(e){console.error('motion err:',e);return false}
  console.log('motion stub:',n);return false;
};
/* 直接设表情参数 (PC bridge 调用) */
window.setExpression=function(n,v){
  console.log('setExpression stub (use applyEmotion):',n,v);return false;
};
/* 带过渡的表情切换 (推荐) */
window._emotionTimer=null;
window._currentEmotion='neutral';
window.applyEmotion=function(name,duration){
  duration=duration||500;
  var model=window._model;
  if(!model)return false;
  var target=EMOTION_PRESETS[name];
  if(!target){console.warn('Unknown emotion:',name);return false}

  // 先停掉 idle motion (否则每帧动画会覆盖我们的参数)
  var im=model.internalModel;
  if(im&&im.motionManager){
    im.motionManager.stopAllMotions();
  }

  window._currentEmotion=name;
  var keys=Object.keys(target);
  var start={};
  for(var i=0;i<keys.length;i++){
    try{start[keys[i]]=model.getParameterValue(keys[i])}catch(e){start[keys[i]]=0}
  }
  var t0=performance.now();
  if(window._emotionTimer)clearInterval(window._emotionTimer);
  if(window._emotionResumeTimer)clearTimeout(window._emotionResumeTimer);
  window._emotionTimer=setInterval(function(){
    var elapsed=performance.now()-t0;
    var t=Math.min(elapsed/duration,1);
    var ease=t<0.5?2*t*t:-1+(4-2*t)*t;
    for(var i=0;i<keys.length;i++){
      var k=keys[i];
      var v=start[k]+(target[k]-start[k])*ease;
      try{model.setParameterValue(k,v)}catch(e){}
    }
    if(t>=1){
      clearInterval(window._emotionTimer);window._emotionTimer=null;
      // 过渡完成后 5 秒再恢复 idle 动画
      window._emotionResumeTimer=setTimeout(function(){
        try{model.motion('Idle');}catch(e){}
      },5000);
    }
  },16);
  console.log('emotion:',name,'->',keys.length,'params,',duration,'ms');
  return true;
};
window.getStatus=function(){
  return{ready:window._ready,motions:window._motions,expressions:window._expressions,emotions:window._emotions,currentEmotion:window._currentEmotion,mood:window._mood};
};
/* 心情值 0-100, <40=sad, 40-60=neutral, >60=happy, >80=surprised */
window.setMood=function(v){
  v=Math.max(0,Math.min(100,v));
  window._mood=v;
  if(window._moodText)window._moodText.text='Mood:'+v;
  var emotion='neutral';
  if(v>=80)emotion='surprised';
  else if(v>=65)emotion='happy';
  else if(v<=25)emotion='angry';
  else if(v<=45)emotion='sad';
  window.applyEmotion(emotion,300);
  return v;
};
window.getMood=function(){return window._mood;};
</script>

<script type="module">
let app, model;
window.PIXI = await import('pixi.js');
const PIXI = window.PIXI;
const L4DM = await import('@jannchie/pixi-live2d-display');
const Live2DModel = L4DM.Live2DModel;

console.log('1. imports OK');

const W=240, H=320;
app = new PIXI.Application();
await app.init({width:W, height:H, background:0x335577,
    resolution:1, antialias:true, preserveDrawingBuffer: true});
document.body.appendChild(app.canvas);
console.log('2. canvas', app.canvas.width, 'x', app.canvas.height, 'screen', app.screen.width, 'x', app.screen.height);

try {
    model = await Live2DModel.from('./Hiyori/Hiyori.model3.json',{autoHitTest:false, autoFocus:false});
    window._model = model;

    model.scale.set(0.16);
    model.x = W/2 - 6;
    model.y = H * 0.55 + 120;
    if (model.anchor) model.anchor.set(0.5, 0.5);

    app.stage.addChild(model);

    // FPS 计数器 (左上角)
    const fpsText = new PIXI.Text({text:"FPS: --", style:{fontSize:14, fill:0x00FF00, fontFamily:"monospace"}});
    fpsText.x = 4; fpsText.y = 4;
    app.stage.addChild(fpsText);
    // 心情值 (右上角)
    const moodText = new PIXI.Text({text:'Mood:60', style:{fontSize:14, fill:0xFFAA00, fontFamily:'monospace', align:'right'}});
    moodText.x = W - 80; moodText.y = 4;
    app.stage.addChild(moodText);
    window._moodText = moodText;
    window._frameTimes = [];
    window._lastTime = performance.now();
    app.ticker.add(() => {
        const now = performance.now();
        const dt = now - window._lastTime;
        window._lastTime = now;
        window._frameTimes.push(dt);
        if (window._frameTimes.length > 60) window._frameTimes.shift();
        if (window._frameTimes.length > 0) {
            const avg = window._frameTimes.reduce((a,b)=>a+b,0) / window._frameTimes.length;
            fpsText.text = "FPS:" + (1000/avg).toFixed(1);
        }
    });

    // 诊断：打印模型实际尺寸和边界
    const b = model.getBounds?.() || 'N/A';
    console.log('3. model at', model.x, model.y, 'scale', model.scale.x,
                'anchor', model.anchor?.x, model.anchor?.y,
                'size', model.width, 'x', model.height,
                'bounds', b);

    const im = model.internalModel;
    if (im?.motionManager) {
        window._motions = Object.keys(im.motionManager.definitions||{});
        if (im.motionManager.expressionManager)
            window._expressions = im.motionManager.expressionManager.definitions.map(e=>e.name);
    }
    console.log('4. SUCCESS. motions:', window._motions, 'expressions:', window._expressions);

    window._ready = true;
	} catch(err) {
    console.error('Live2D load failed:', err.message, err.stack);
    window._ready = true;
}
</script>
</body>
</html>
